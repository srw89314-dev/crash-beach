name: Crash Beach Smoke Checks

on:
  push:
    branches: [main, v0.50-polish]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run structural smoke checks
        run: node tests/smoke.mjs
